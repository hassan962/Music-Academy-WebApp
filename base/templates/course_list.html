{% extends 'main.html' %}
{% block content %}
<h1 class="mb-4">Available Courses</h1>
<div class="row g-3">
  {% for course in courses %}
    <div class="col-md-6">
      <div class="card p-3 h-100 d-flex flex-column">
        <h5 class="card-title mb-1">{{ course.title }}</h5>
        <p class="text-muted mb-3" style="font-size: .85rem;">with {{ course.teacher.first_name }} {{ course.teacher.last_name }}</p>
        <p class="mb-3">{{ course.description }}</p>
        <a href="{% url 'course_detail' course.slug %}" class="btn btn-outline-primary mt-auto align-self-start">View Details</a>
      </div>
    </div>
  {% empty %}
    <p class="text-muted">No courses have been created yet.</p>
  {% endfor %}
</div>
{% endblock %}
