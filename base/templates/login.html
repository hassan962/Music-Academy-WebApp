{% extends 'main.html' %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-lg-9">
    <div class="row g-0 shadow-sm" style="border-radius: 14px; overflow: hidden;">
      <div class="col-md-5 auth-panel">
        <div class="brand-serif" style="font-size: 1.4rem; font-style: italic;">Music Academy</div>
        <blockquote class="brand-serif mb-0" style="font-size: 1.6rem; line-height: 1.3;">
          &ldquo;My teacher actually watches my videos and tells me what to fix.&rdquo;
        </blockquote>
      </div>
      <div class="col-md-7 auth-form-side">
        <h1 class="mb-1">Welcome back</h1>
        <p class="text-muted mb-4">Log in to pick up where you left off.</p>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
          <p class="mt-3 mb-0 text-center">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
